baseurl:  https://blog.alenliu.space
languageCode: zh-cn
theme: hugo-theme-stack
pagination:
  pagerSize: 7
  path: page

title: AlenLiu's blog
copyright: 🗻AlenLiu-InfiniteSpace.

# Theme i18n support
# Available values: ar, bn, ca, de, el, en, es, fr, hu, id, it, ja, ko, nl, pt-br, th, uk, zh-cn, zh-hk, zh-tw
DefaultContentLanguage: zh-cn

# Set hasCJKLanguage to true if DefaultContentLanguage is in [zh-cn ja ko]
# This will make .Summary and .WordCount behave correctly for CJK languages.
hasCJKLanguage: true
languages:
    zh-cn:
        languageName: 中文
        title: 🗻AlenLiu's Blog
        weight: 1
        params:
            description: 🗻AlenLiu-InfiniteSpace.
    # en:
    #     languageName: English
    #     title: Example Site
    #     weight: 2
    #     params:
    #         description: AlenLiu's InfiniteSpace.


services:
    # Change it to your Disqus shortname before using
    disqus:
        shortname: "hugo-theme-stack"
    # GA Tracking ID
    googleAnalytics:
        id:

permalinks:
    post: /p/:slug/
    page: /:slug/

params:
    mainSections:
        - post
    featuredImageField: image
    rssFullContent: true
    favicon: "/img/favicon.ico" # e.g.: favicon placed in `static/favicon.ico` of your site folder, then set this field to `/favicon.ico` (`/` is necessary)

    footer:
        since: 2024
        customText: <a href="https://beian.miit.gov.cn/" target="_blank">粤ICP备2024206799</a>

    dateFormat:
        published: Jan 02, 2006
        lastUpdated: Jan 02, 2006 15:04 MST

    sidebar:
        comppact: false
        emoji: 💭
        subtitle: 沉着冷静.不断攀登🧗🏼‍♂️
        avatar:
            enabled: true
            local: false
            src: https://gallery.alenliu.space/life/e5b414de3aae85862ef9f1ec9b508123.jpg

    article:
        math: true
        toc: true
        readingTime: true
        wordCount: true
        frontmatter:
            lastmod: [":fileModTime", "lastmod"]
        license:
            enabled: true
            default: AlenLiu

    comments:
        enabled: true
        provider: twikoo
        twikoo:
            envId: https://twikoovercel-dun.vercel.app
            lang: zh-CN

        # See https://cactus.chat/docs/reference/web-client/#configuration for description of the various options
        cactus:
            defaultHomeserverUrl: "https://matrix.cactus.chat:8448"
            serverName: "cactus.chat"
            siteName: "" # You must insert a unique identifier here matching the one you registered (See https://cactus.chat/docs/getting-started/quick-start/#register-your-site)

        giscus:
            repo:
            repoID:
            category:
            categoryID:
            mapping:
            lightTheme:
            darkTheme:
            reactionsEnabled: 1
            emitMetadata: 0

        gitalk:
            owner:
            admin:
            repo:
            clientID:
            clientSecret:

        cusdis:
            host:
            id:
    widgets:
        homepage:
            - type: search
            - type: archives
              params:
                  limit: 3
            - type: categories
              params:
                  limit: 10
            - type: tag-cloud
              params:
                  limit: 10
        page:
            - type: toc

    opengraph:
        twitter:
            # Your Twitter username
            site:

            # Available values: summary, summary_large_image
            card: summary_large_image

    defaultImage:
        opengraph:
            enabled: false
            local: false
            src:

    colorScheme:
        # Display toggle
        toggle: true

        # Available values: auto, light, dark
        default: auto

    imageProcessing:
        cover:
            enabled: false
        content:
            enabled: false

### Custom menu
### See https://docs.stack.jimmycai.com/configuration/custom-menu.html
### To remove about, archive and search page menu item, remove `menu` field from their FrontMatter
menu:
    main: []

    social:
    
        - identifier: rss
          name: RSS
          url: /index.xml
          params:
            newTab: true
            icon: rss
           
        - identifier: 抖音
          name: Alen的抖音
          url: https://www.douyin.com/user/MS4wLjABAAAAJGm5szbdxYctKnpdDZftPS3rZMdsCTwHeA-3gdfsnXBCKkVcPPdAqLCXSlYHg2jT
          params:
            newTab: true
            icon: 抖音

        - identifier: 画廊Gallery
          name: 作品集Gallery
          url: https://gallery.alenliu.space/
          params:
            newTab: true
            icon: 作品集Gallery

        - identifier: Ins
          name: Ins
          url: https://www.instagram.com/alenliu0/
          params:
            newTab: true
            icon: Ins
        
        - identifier: 博客随笔Memos
          name: 博客随笔Memos
          url: https://memos.alenliu.space/
          params:
            newTab: true
            icon: 博客随记Memos

        - identifier: 小红书
          name: 小红书
          url: https://www.xiaohongshu.com/user/profile/5ac050ff4eacab08974fea9a
          params:
            newTab: true
            icon: 小红书

        - identifier: bomepage
          name: bomepage
          url: https://homepage.alenliu.space/
          params:
            newTab: true
            icon: 主页Homepage

related:
    includeNewer: true
    threshold: 60
    toLower: false
    indices:
        - name: tags
          weight: 100

        - name: categories
          weight: 200

markup:
    goldmark:
        renderer:
            ## Set to true if you have HTML content inside Markdown
            unsafe: true
    tableOfContents:
        endLevel: 4
        ordered: true
        startLevel: 2
    highlight:
        noClasses: false
        codeFences: true
        guessSyntax: true
        lineNoStart: 1
        lineNos: true
        lineNumbersInTable: true
        tabWidth: 4
